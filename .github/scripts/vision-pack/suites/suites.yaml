# Suites of the rocPyDecode vision-pack QA workflow: the rocpydecode suite,
# plus robustness and robustness-nogpu cut down to their rocPyDecode checks.
# The entries keep the values of the full vision-pack QA matrix, and the file
# keeps to "  name:" / "    key: value" lines so it can also be read without
# PyYAML.
#
#   runner:  where plan_matrix.py places the suite (hosted, gpu or cpu). Here
#            the gpu job runs rocpydecode and robustness, and the cpu job runs
#            robustness-nogpu in a container without GPU devices.
#   tiers:   the tiers that include the suite. Inside a suite, run.sh scales the
#            work further with vp_tier_ge (quick < standard < comprehensive < full).
#   image:   test (install_deps.sh) or media (install_deps.sh --media, adds ffmpeg).
#   entrypoint: script to run (default suites/<name>/run.sh).
#   gpu_access: chosen (default: the detected GPU only),
#               all    (also the GPUs the build does not target, for
#                       unsupported-GPU negatives), or
#               none   (no GPU device at all: CPU paths must still work).
#   needs_gpu:  true (default) or false. On a run without a usable GPU,
#               merge.py reports a missing suite that needs one as
#               <suite>::infra::no-gpu instead of <suite>::infra::no-results.
#
# Timeouts are about three times the comprehensive wall time measured on
# 27 Sep 2026 (nightly-20260926, RX 9070 XT), with room for the full tier's
# extras and the downloads. A timeout is an infrastructure error, so keep them
# tight enough to catch hangs.

suites:
  rocpydecode:
    runner: gpu
    tiers: [standard, comprehensive, full]
    timeout_minutes: 15  # measured 9 s; each script has its own 300 s limit
    image: media
    description: raw video decode, rocPyJpegDecode, expected demuxer failures

  # robustness and robustness-nogpu hold only the rocPyDecode checks here
  # (measured about 0.1 s and 1 s); the timeouts and descriptions are those of
  # the full suites.
  robustness:
    runner: gpu
    tiers: [comprehensive, full]
    timeout_minutes: 15
    image: test
    gpu_access: all
    description: unsupported-GPU negatives, exit-code honesty, hang guards

  robustness-nogpu:
    runner: gpu
    tiers: [comprehensive, full]
    timeout_minutes: 10
    image: test
    gpu_access: none
    needs_gpu: false
    entrypoint: suites/robustness/nogpu.sh
    description: CPU pipelines in a container with no GPU device
